<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // التليفون بالعرض: الصفحة بعرض 1024 (شاشة لابتوب صغير) وبتتصغّر على قد عرض التليفون
    // التليفون بالطول: عرض التليفون الطبيعي (علشان رسالة «اقلب التليفون» تبان مظبوط)
    (function () {
      var phone = false;
      try { phone = window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 600; } catch (e) {}
      window.__credoPhone = phone;
      if (!phone) return;
      var meta = document.querySelector('meta[name=viewport]');
      window.__credoIsPortrait = function () {
        try { if (screen.orientation && screen.orientation.type) return screen.orientation.type.indexOf('portrait') === 0; } catch (e) {}
        if (typeof window.orientation === 'number') return window.orientation === 0 || window.orientation === 180;
        return screen.height > screen.width;
      };
      window.__credoApplyViewport = function () {
        var wide = !window.__credoIsPortrait() || window.__credoRotateSkipped;
        var want = wide ? 'width=1024, user-scalable=yes' : 'width=device-width, initial-scale=1.0';
        if (meta.getAttribute('content') !== want) meta.setAttribute('content', want);
      };
      try { window.__credoRotateSkipped = sessionStorage.getItem('credo_demo_rotate_skip') === '1'; } catch (e) {}
      window.__credoApplyViewport();
    })();
  </script>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light only" />
  <link rel="icon" type="image/png" href="/demo/favicon.png" />
  <title>Credo — تجربة البرنامج</title>
  <style id="gate-style">
    :root { color-scheme: light; }
    :root { --brand: #02475e; --brand2: #00607a; --bg: #eef5f8; --card: #ffffff; --text: #0f2a35; --muted: #5b7380; --danger: #be123c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Cairo, Tahoma, 'Segoe UI', sans-serif; }
    #gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { width: 100%; max-width: 420px; background: var(--card); border-radius: 24px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(2, 71, 94, .18); text-align: center; }
    .logo { width: 180px; max-width: 70%; margin: 0 auto 6px; display: block; }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 1.5px solid #cfe0e7; font: 600 15px inherit; background: transparent; color: var(--text); text-align: center; letter-spacing: 1px; }
    input:focus { outline: none; border-color: var(--brand2); }
    button { margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 14px; background: linear-gradient(90deg, var(--brand), var(--brand2)); color: #fff; font: 800 15px inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    label.rem { display: flex; gap: 6px; align-items: center; justify-content: center; margin-top: 12px; font-size: 12px; color: var(--muted); cursor: pointer; }
    .err { color: var(--danger); font-size: 13px; font-weight: 700; margin-top: 10px; min-height: 18px; }
  </style>
</head>
<body>
  <div id="gate">
    <form class="card" id="f" autocomplete="off">
      <img class="logo" src="/demo/assets/credo-logo-brand-ClQst5ri.png" alt="Credo" onerror="this.style.display='none'" />
      <h1>تجربة برنامج Credo</h1>
      <p>نسخة كاملة من البرنامج تقدر تجرّبها من المتصفح — بيع وشراء وأصناف ونواقص وتقارير.<br />اكتب كلمة السر اللي وصلتك علشان تدخل.</p>
      <input id="pw" type="password" placeholder="كلمة السر" autofocus />
      <label class="rem"><input id="rem" type="checkbox" style="width:auto" checked /> افتكرني على الجهاز ده</label>
      <button id="go" type="submit">ادخل على التجربة</button>
      <div class="err" id="err"></div>
    </form>
  </div>
  <div id="root"></div>

  <!-- التليفون: رسالة «اقلب التليفون» وهو بالطول (من أول ما الصفحة تفتح) -->
  <div id="rotate" dir="rtl" style="display:none;position:fixed;inset:0;z-index:2147483647;background:linear-gradient(160deg,#02475e,#00607a 60%,#0a7a8f);color:#fff;font-family:Cairo,Tahoma,'Segoe UI',sans-serif;text-align:center;align-items:center;justify-content:center;flex-direction:column;padding:6vw;box-sizing:border-box">
    <svg viewBox="0 0 64 64" style="width:26vw;height:26vw;max-width:150px;max-height:150px;animation:credo-rot 2.4s ease-in-out infinite" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="20" y="6" width="24" height="44" rx="5" />
      <line x1="29" y1="43" x2="35" y2="43" />
      <path d="M50 52c4-3 6-8 6-13" stroke="#5eead4" />
      <path d="M53 37l3 2 2-3" stroke="#5eead4" />
    </svg>
    <div style="font-size:6.4vw;font-weight:800;margin-top:5vw;line-height:1.4">اقلب التليفون بالعرض</div>
    <div style="font-size:3.9vw;line-height:1.8;margin-top:2.5vw;opacity:.9;max-width:88vw">البرنامج معمول لشاشة عريضة زي الكمبيوتر — لفّ التليفون علشان تشوف كل حاجة واضحة وكبيرة</div>
    <button id="rotate-skip" type="button" style="margin-top:7vw;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:3vw;padding:2.6vw 5vw;font:700 3.6vw Cairo,Tahoma,sans-serif;width:auto;cursor:pointer">التليفون مش بيلف؟ كمّل كده</button>
  </div>
  <style>@keyframes credo-rot{0%,15%{transform:rotate(0)}45%,70%{transform:rotate(-90deg)}100%{transform:rotate(0)}}</style>
  <script>
    // ===== نسخة التليفون =====
    // التليفون بالعرض: البرنامج بيتعرض بعرض شاشة لابتوب صغير (1024) ويتصغّر على قد عرض التليفون
    // — نفس شكل البرنامج على الكمبيوتر بالظبط، والقايمة الجانبية مقفولة علشان المساحة.
    // التليفون بالطول: رسالة «اقلب التليفون».
    (function () {
      if (!window.__credoPhone) return;
      var box = document.getElementById('rotate');
      var update = function () {
        window.__credoApplyViewport();
        box.style.display = (!window.__credoRotateSkipped && window.__credoIsPortrait()) ? 'flex' : 'none';
      };
      document.getElementById('rotate-skip').addEventListener('click', function () {
        window.__credoRotateSkipped = true;
        try { sessionStorage.setItem('credo_demo_rotate_skip', '1'); } catch (e) {}
        update();
      });
      try { if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', function () { setTimeout(update, 100); }); } catch (e) {}
      window.addEventListener('orientationchange', function () { setTimeout(update, 150); });
      window.addEventListener('resize', update);
      update();
      // القايمة الجانبية تبدأ مقفولة على التليفون (أول مرة بس — بعد كده زي ما الزائر يسيبها)
      try {
        if (!localStorage.getItem('credo_demo_phone_init')) {
          localStorage.setItem('credo_sidebar_open', 'false');
          localStorage.setItem('credo_demo_phone_init', '1');
        }
      } catch (e) {}
    })();
    window.__credoPhoneViewport = function () {
      if (window.__credoPhone && window.__credoApplyViewport) window.__credoApplyViewport();
    };
  </script>
  <script>
    (function () {
      var REM_KEY = 'credo_demo_pw';
      var b64 = function (s) { var bin = atob(s); var a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
      var payloadP = fetch('/demo/app.bin', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('load'); return r.json(); });

      async function decryptAll(password) {
        var p = await payloadP;
        var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
        var key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(p.salt), iterations: p.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        var gunzip = async function (u8) { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()); };
        var dec = async function (x) { var raw = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(x.iv) }, key, b64(x.data))); return p.gz ? gunzip(raw) : raw; };
        var check = new TextDecoder().decode(await dec(p.check));
        if (check !== 'credo-demo-ok') throw new Error('bad');
        return { js: await dec(p.js), css: await dec(p.css), drugs: p.drugs ? await dec(p.drugs) : null };
      }

      async function start(password, remember) {
        var out = await decryptAll(password);
        if (out.drugs) { try { window.__CREDO_MASTER_DRUGS = JSON.parse(new TextDecoder().decode(out.drugs)); } catch (e) {} }
        try { if (remember) localStorage.setItem(REM_KEY, password); } catch (e) {}
        var style = document.createElement('style');
        style.textContent = new TextDecoder().decode(out.css);
        document.head.appendChild(style);
        document.getElementById('gate').remove();
        // الصفحة ترجع زي البرنامج على الجهاز بالظبط (وضع النهار ومن غير ستايل شاشة الباسوورد)
        var gs = document.getElementById('gate-style'); if (gs) gs.remove();
        var html = document.documentElement;
        html.setAttribute('lang', 'en'); html.removeAttribute('dir'); html.style.colorScheme = 'light';
        try { localStorage.setItem('theme', 'light'); } catch (e) {}
        html.classList.remove('dark'); document.body.classList.remove('dark');
        if (window.__credoPhoneViewport) window.__credoPhoneViewport();
        var url = URL.createObjectURL(new Blob([out.js], { type: 'text/javascript' }));
        var s = document.createElement('script');
        s.type = 'module';
        s.src = url;
        document.body.appendChild(s);
      }

      var form = document.getElementById('f');
      var err = document.getElementById('err');
      var btn = document.getElementById('go');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        err.textContent = '';
        btn.disabled = true;
        btn.textContent = 'بيفتح...';
        try {
          await start(document.getElementById('pw').value, document.getElementById('rem').checked);
        } catch (x) {
          err.textContent = x && x.message === 'load' ? 'مقدرتش أحمّل التجربة — اتأكد من النت وجرّب تاني' : 'كلمة السر مش صحيحة';
          btn.disabled = false;
          btn.textContent = 'ادخل على التجربة';
        }
      });
      // اتفتح قبل كده على الجهاز ده
      try {
        var saved = localStorage.getItem(REM_KEY);
        if (saved) start(saved, true).catch(function () { localStorage.removeItem(REM_KEY); });
      } catch (e) {}
    })();
  </script>
</body>
</html>
